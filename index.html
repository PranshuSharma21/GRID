<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRID - IoT Telemetry System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #030014;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            padding-bottom: 60px;
        }

        .bg-grid {
            position: fixed;
            inset: 0;
            background-size: 50px 50px;
            background-image: 
                linear-gradient(to right, rgba(168, 85, 247, 0.07) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(168, 85, 247, 0.07) 1px, transparent 1px);
            z-index: -2;
        }

        .bg-glow {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.25) 0%, rgba(120, 53, 15, 0) 70%);
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            animation: pulseGlow 8s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes pulseGlow {
            0% {
                transform: translate(-50%, -50%) scale(0.8);
                opacity: 0.5;
            }
            50% {
                transform: translate(-45%, -55%) scale(1.2);
                opacity: 0.85;
            }
            100% {
                transform: translate(-55%, -45%) scale(1);
                opacity: 0.6;
            }
        }

        .nav-container {
            margin-top: 30px;
            margin-bottom: 20px;
            z-index: 10;
        }

        .nav-box {
            display: inline-flex;
            gap: 16px;
            background: #ffffff;
            padding: 14px 18px;
            border-radius: 999px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        .nav-link {
            text-decoration: none;
            color: #111;
            font-size: 18px;
            padding: 16px 32px;
            border-radius: 999px;
            font-weight: 600;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .nav-link::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(135deg, #c084fc, #a855f7);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 0;
        }

        .nav-link::after {
            content: "";
            position: absolute;
            top: 0;
            left: -120%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                120deg,
                transparent,
                rgba(255,255,255,0.6),
                transparent
            );
            transition: 0.6s;
            z-index: 1;
        }

        .nav-link:hover::before, .nav-link.active::before {
            opacity: 1;
        }

        .nav-link:hover::after {
            left: 120%;
        }

        .nav-link:hover, .nav-link.active {
            color: white;
            box-shadow: 
                0 0 20px rgba(168, 85, 247, 0.8),
                0 0 40px rgba(168, 85, 247, 0.5);
        }

        .nav-link span {
            position: relative;
            z-index: 2;
        }

        .main-container {
            width: 100%;
            max-width: 1100px;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .particle-container {
            width: 100%;
            height: 280px;
            position: relative;
        }

        .particle-text {
            position: relative;
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            isolation: isolate;
        }

        .particle-text__canvas {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .particle-text__sr {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .hero-subtitle {
            font-size: 1.25rem;
            color: #c084fc;
            max-width: 700px;
            line-height: 1.6;
            margin-top: -10px;
            margin-bottom: 35px;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .cta-btn {
            display: inline-block;
            text-decoration: none;
            color: #ffffff;
            background: linear-gradient(135deg, #c084fc, #a855f7);
            padding: 16px 36px;
            border-radius: 999px;
            font-size: 1.1rem;
            font-weight: 600;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
            transition: all 0.3s ease;
        }

        .cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.8);
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="bg-glow"></div>

    <div class="nav-container">
        <div class="nav-box">
            <a href="index.html" class="nav-link"><span>Home</span></a>
            <a href="about.html" class="nav-link"><span>About Us</span></a>
            <a href="dashboard.html" class="nav-link"><span>Dashboard</span></a>
            <a href="contact.html" class="nav-link"><span>Contact Us</span></a>
            <a href="beta.html" class="nav-link"><span>Beta Version</span></a>
        </div>
    </div>

    <div class="main-container">
        <div class="particle-container">
            <div id="particle-text-mount" class="particle-text" aria-label="G.R.I.D">
                <canvas id="particle-canvas" class="particle-text__canvas" aria-hidden="true"></canvas>
                <span class="particle-text__sr">G.R.I.D</span>
            </div>
        </div>

        <p class="hero-subtitle">Gateway for Repairs Inventory and Dispatch</p>
        <a href="dashboard.html" class="cta-btn">Launch Live Dashboard</a>
    </div>

    <script>
        const links = document.querySelectorAll(".nav-link");
        const current = window.location.pathname.split("/").pop() || "index.html";

        links.forEach(link => {
            if (link.getAttribute("href") === current) {
                link.classList.add("active");
            }

            link.addEventListener("click", function () {
                links.forEach(l => l.classList.remove("active"));
                this.classList.add("active");
            });
        });

        (function() {
            const config = {
                text: "G.R.I.D",
                particleSize: 2,
                density: 4,
                color: "#ffffff",
                highlightColor: "#a855f7",
                scatter: 180,
                gatherDuration: 1600,
                stagger: 420,
                pointerRepel: 40,
                repelRadius: 120,
                idleDrift: 0.7,
                trigger: "mount",
                fontSize: "clamp(3rem, 12vw, 8rem)",
                fontWeight: "800",
                fontFamily: "inherit",
                glow: true
            };

            const container = document.getElementById('particle-text-mount');
            const canvas = document.getElementById('particle-canvas');
            if (!container || !canvas) return;

            const ctx = canvas.getContext('2d');
            if (!ctx) return;

            const hexToRgb = hex => {
                const clean = hex.replace('#', '').trim();
                if (!/^[0-9a-fA-F]{6}$/.test(clean)) return null;
                return {
                    r: parseInt(clean.slice(0, 2), 16),
                    g: parseInt(clean.slice(2, 4), 16),
                    b: parseInt(clean.slice(4, 6), 16)
                };
            };

            const mixRgb = (from, to, amount) => ({
                r: Math.round(from.r + (to.r - from.r) * amount),
                g: Math.round(from.g + (to.g - from.g) * amount),
                b: Math.round(from.b + (to.b - from.b) * amount)
            });

            const rgbToCss = rgb => `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
            const clamp = (value, min, max) => Math.min(Math.max(value, min), max);
            const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

            const resolveFontSize = (value, container, fontWeight, fontFamily) => {
                if (typeof value === 'number') return value;
                const probe = document.createElement('span');
                probe.textContent = 'M';
                probe.style.position = 'absolute';
                probe.style.visibility = 'hidden';
                probe.style.pointerEvents = 'none';
                probe.style.fontSize = value;
                probe.style.fontWeight = String(fontWeight);
                probe.style.fontFamily = fontFamily;
                container.appendChild(probe);
                const size = parseFloat(window.getComputedStyle(probe).fontSize) || 96;
                probe.remove();
                return size;
            };

            const waitForFonts = async font => {
                if (!('fonts' in document)) return;
                try { await document.fonts.load(font); } catch {}
                await document.fonts.ready;
            };

            let particles = [];
            let animationFrame = null;
            let resizeFrame = null;
            let buildId = 0;
            let gathering = false;
            let gatherStart = 0;
            let reducedMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches ?? false;
            let width = 0;
            let height = 0;
            let dpr = 1;

            const pointer = { active: false, x: 0, y: 0, smoothX: 0, smoothY: 0 };

            const startGather = (fromScatter = true) => {
                if (!particles.length) return;
                const now = performance.now();
                const spread = reducedMotion ? 0 : config.scatter;

                particles.forEach(particle => {
                    if (fromScatter) {
                        const angle = particle.seed * Math.PI * 2;
                        const distance = spread * (0.35 + particle.depth * 0.75);
                        particle.x = particle.targetX + Math.cos(angle) * distance + (particle.depth - 0.5) * spread * 0.55;
                        particle.y = particle.targetY + Math.sin(angle) * distance + (particle.seed - 0.5) * spread * 0.55;
                    }
                    particle.startX = particle.x;
                    particle.startY = particle.y;
                    particle.delay = reducedMotion ? 0 : particle.seed * config.stagger;
                });

                gatherStart = now;
                gathering = true;
            };

            const drawParticle = particle => {
                const size = particle.size;
                ctx.fillStyle = particle.color;

                if (size <= 2.1) {
                    ctx.fillRect(particle.x - size / 2, particle.y - size / 2, size, size);
                    return;
                }

                ctx.beginPath();
                ctx.arc(particle.x, particle.y, size / 2, 0, Math.PI * 2);
                ctx.fill();
            };

            const render = now => {
                ctx.clearRect(0, 0, width, height);

                if (config.glow && !reducedMotion) {
                    ctx.shadowBlur = config.particleSize * 3;
                    ctx.shadowColor = config.highlightColor;
                } else {
                    ctx.shadowBlur = 0;
                }

                pointer.smoothX += (pointer.x - pointer.smoothX) * 0.18;
                pointer.smoothY += (pointer.y - pointer.smoothY) * 0.18;

                let complete = true;

                particles.forEach(particle => {
                    let baseX = particle.targetX;
                    let baseY = particle.targetY;
                    let progress = 1;

                    if (gathering) {
                        const local = (now - gatherStart - particle.delay) / Math.max(1, reducedMotion ? 1 : config.gatherDuration);
                        progress = clamp(local, 0, 1);
                        const eased = easeOutCubic(progress);
                        baseX = particle.startX + (particle.targetX - particle.startX) * eased;
                        baseY = particle.startY + (particle.targetY - particle.startY) * eased;
                        if (progress < 1) complete = false;
                    } else if (!reducedMotion && config.idleDrift > 0) {
                        const driftTime = now * 0.001;
                        baseX += Math.sin(driftTime * 0.9 + particle.seed * 10) * config.idleDrift * particle.depth;
                        baseY += Math.cos(driftTime * 0.75 + particle.depth * 10) * config.idleDrift * particle.depth;
                    }

                    if (pointer.active && !reducedMotion && config.pointerRepel > 0 && config.repelRadius > 0) {
                        const dx = baseX - pointer.smoothX;
                        const dy = baseY - pointer.smoothY;
                        const distance = Math.hypot(dx, dy);
                        if (distance > 0 && distance < config.repelRadius) {
                            const force = Math.pow(1 - distance / config.repelRadius, 2) * config.pointerRepel;
                            baseX += (dx / distance) * force;
                            baseY += (dy / distance) * force;
                        }
                    }

                    const follow = reducedMotion ? 1 : 0.22;
                    particle.x += (baseX - particle.x) * follow;
                    particle.y += (baseY - particle.y) * follow;

                    ctx.globalAlpha = clamp(0.35 + progress * 0.65, 0, 1);
                    drawParticle(particle);
                });

                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;

                if (gathering && complete) {
                    gathering = false;
                }

                animationFrame = window.requestAnimationFrame(render);
            };

            const ensureRenderLoop = () => {
                if (animationFrame === null) {
                    animationFrame = window.requestAnimationFrame(render);
                }
            };

            const sampleText = async () => {
                const currentBuild = ++buildId;
                const rect = container.getBoundingClientRect();
                width = Math.floor(rect.width);
                height = Math.floor(rect.height);

                if (width <= 0 || height <= 0) return;

                dpr = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width = Math.max(1, Math.floor(width * dpr));
                canvas.height = Math.max(1, Math.floor(height * dpr));
                canvas.style.width = '100%';
                canvas.style.height = '100%';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                const computed = window.getComputedStyle(container);
                const resolvedFamily = config.fontFamily === 'inherit' ? computed.fontFamily || 'sans-serif' : config.fontFamily;
                let resolvedSize = resolveFontSize(config.fontSize, container, config.fontWeight, resolvedFamily);
                let font = `${config.fontWeight} ${resolvedSize}px ${resolvedFamily}`;

                await waitForFonts(font);
                if (currentBuild !== buildId) return;

                const offscreen = document.createElement('canvas');
                const offCtx = offscreen.getContext('2d', { willReadFrequently: true });
                if (!offCtx) return;

                const content = String(config.text || ' ');
                const maxTextWidth = width * 0.92;
                offCtx.font = font;
                let metrics = offCtx.measureText(content);
                const measuredWidth = Math.max(1, metrics.width);
                if (measuredWidth > maxTextWidth) {
                    resolvedSize = Math.max(18, resolvedSize * (maxTextWidth / measuredWidth));
                    font = `${config.fontWeight} ${resolvedSize}px ${resolvedFamily}`;
                    await waitForFonts(font);
                    if (currentBuild !== buildId) return;
                    offCtx.font = font;
                    metrics = offCtx.measureText(content);
                }

                const left = Math.ceil(metrics.actualBoundingBoxLeft || 0);
                const right = Math.ceil(metrics.actualBoundingBoxRight || metrics.width);
                const ascent = Math.ceil(metrics.actualBoundingBoxAscent || resolvedSize * 0.78);
                const descent = Math.ceil(metrics.actualBoundingBoxDescent || resolvedSize * 0.22);
                const padding = Math.max(12, Math.ceil(resolvedSize * 0.08));
                const textWidth = Math.max(1, left + right);
                const textHeight = Math.max(1, ascent + descent);

                offscreen.width = textWidth + padding * 2;
                offscreen.height = textHeight + padding * 2;
                offCtx.clearRect(0, 0, offscreen.width, offscreen.height);
                offCtx.font = font;
                offCtx.textAlign = 'left';
                offCtx.textBaseline = 'alphabetic';
                offCtx.fillStyle = '#ffffff';
                offCtx.fillText(content, padding - left, padding + ascent);

                const imageData = offCtx.getImageData(0, 0, offscreen.width, offscreen.height);
                const targets = [];
                const step = Math.max(2, Math.floor(config.density));

                for (let y = 0; y < offscreen.height; y += step) {
                    for (let x = 0; x < offscreen.width; x += step) {
                        const alpha = imageData.data[(y * offscreen.width + x) * 4 + 3];
                        if (alpha > 40) {
                            targets.push({
                                x: width / 2 - offscreen.width / 2 + x,
                                y: height / 2 - offscreen.height / 2 + y,
                                alpha: alpha / 255
                            });
                        }
                    }
                }

                const maxParticles = Math.max(900, Math.min(5200, Math.floor((width * height) / 90)));
                const stride = Math.max(1, Math.ceil(targets.length / maxParticles));
                const baseRgb = hexToRgb(config.color);
                const highlightRgb = hexToRgb(config.highlightColor);
                const selected = targets.filter((_, index) => index % stride === 0);

                particles = selected.map((target, index) => {
                    const seed = ((index * 9301 + 49297) % 233280) / 233280;
                    const depth = 0.45 + (((index * 233 + 97) % 1000) / 1000) * 0.9;
                    const blend = baseRgb && highlightRgb ? clamp(target.x / Math.max(1, width) + (seed - 0.5) * 0.35, 0, 1) : 0;
                    const particleColor = baseRgb && highlightRgb ? rgbToCss(mixRgb(baseRgb, highlightRgb, blend)) : config.color;
                    const angle = seed * Math.PI * 2;
                    const distance = (reducedMotion ? 0 : config.scatter) * (0.35 + depth * 0.75);
                    const startX = target.x + Math.cos(angle) * distance + (seed - 0.5) * config.scatter * 0.45;
                    const startY = target.y + Math.sin(angle) * distance + (depth - 0.9) * config.scatter * 0.45;

                    return {
                        x: reducedMotion ? target.x : startX,
                        y: reducedMotion ? target.y : startY,
                        startX,
                        startY,
                        targetX: target.x,
                        targetY: target.y,
                        size: Math.max(0.6, config.particleSize * (0.75 + target.alpha * 0.45)),
                        color: particleColor,
                        seed,
                        depth,
                        delay: seed * config.stagger
                    };
                });

                pointer.x = width / 2;
                pointer.y = height / 2;
                pointer.smoothX = pointer.x;
                pointer.smoothY = pointer.y;

                if (reducedMotion) {
                    particles.forEach(particle => {
                        particle.x = particle.targetX;
                        particle.y = particle.targetY;
                        particle.startX = particle.targetX;
                        particle.startY = particle.targetY;
                        particle.delay = 0;
                    });
                    gathering = false;
                } else {
                    startGather(false);
                }

                ensureRenderLoop();
            };

            const queueSample = () => {
                if (resizeFrame) window.cancelAnimationFrame(resizeFrame);
                resizeFrame = window.requestAnimationFrame(sampleText);
            };

            const handlePointerMove = event => {
                const rect = canvas.getBoundingClientRect();
                pointer.x = event.clientX - rect.left;
                pointer.y = event.clientY - rect.top;
                pointer.active = true;
            };

            const handlePointerLeave = () => {
                pointer.active = false;
            };

            const handlePointerEnter = event => {
                handlePointerMove(event);
                if (config.trigger === 'hover') startGather(true);
            };

            const handleClick = () => {
                if (config.trigger === 'click') startGather(true);
            };

            canvas.addEventListener('pointerenter', handlePointerEnter);
            canvas.addEventListener('pointermove', handlePointerMove);
            canvas.addEventListener('pointerleave', handlePointerLeave);
            canvas.addEventListener('click', handleClick);

            const resizeObserver = new ResizeObserver(queueSample);
            resizeObserver.observe(container);
            sampleText();
        })();
    </script>
</body>
</html>
